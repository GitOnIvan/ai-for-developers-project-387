name: Nightly Lighthouse Audit

on:
  schedule:
    - cron: '0 2 * * *'      # Ночной запуск в 02:00 UTC
  workflow_dispatch:          # Кнопка ручного запуска

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Собираем Docker-образ вашего приложения
      - name: Build Docker Image
        run: docker build -t my-app:latest .

      # 3. Запускаем контейнер в фоновом режиме (-d) и ждем старта Spring Boot
      - name: Start App Container
        run: |
          docker run -d -p 8080:8080 --name running-app -e PORT=8080 my-app:latest
          echo "Ожидаем 20 секунд, пока Spring Boot поднимется..."
          sleep 20
          docker ps # Проверяем, что контейнер живой и работает

      # 4. Запускаем Lighthouse аудит работающего локального сервера
      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
          uploadArtifacts: true        # Сохраняем отчет в архивы сборки
          temporaryPublicStorage: true # Временная ссылка для анализа агентом OpenCode

      # 5. Останавливаем контейнер после завершения теста
      - name: Stop App Container
        if: always()
        run: docker stop running-app || true
