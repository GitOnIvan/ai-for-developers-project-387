name: Nightly Lighthouse Audit

on:
  schedule:
    - cron: '0 2 * * *'      # Ночной запуск в 02:00 UTC
  workflow_dispatch:          # Кнопка ручного запуска

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Собираем Docker-образ из вашего Dockerfile
      - name: Build Docker Image
        run: docker build -t my-app:latest .

      # 3. Запускаем контейнер в фоне на порту 8080 и тестируем его через Lighthouse
      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Команда запускает собранный Docker-контейнер, пробрасывая порт 8080 наружу
          startServerCommand: docker run --rm -p 8080:8080 -e PORT=8080 my-app:latest

          # Даем приложению внутри контейнера пару секунд, чтобы успел запуститься Spring Boot
          startServerReadyTimeout: 30000

          # Адрес, который будет тестировать Lighthouse (Spring Boot на порту 8080)
          urls: |
            http://localhost:8080/

          uploadArtifacts: true        # Сохраняет отчет в архив, чтобы посмотреть утром
          temporaryPublicStorage: true # Дает временную ссылку для анализа агентом OpenCode
